; Dev only: docker-compose.yml mounts this into the app container. The prod
; image never copies it, and never installs Xdebug.
;
; Every request tries to reach the editor on the Mac. When the editor isn't
; listening, Xdebug logs one "could not connect" line and the request carries
; on as normal.
xdebug.mode=debug
xdebug.start_with_request=yes
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
