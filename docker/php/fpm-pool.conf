; Copied in as zz-prod.conf, so it loads after the official image's
; docker.conf and overrides it.

[www]
; nginx already logs every request. docker.conf also sends PHP-FPM's access
; log to stderr, which put each request in the logs twice. Errors and
; Laravel's own stderr log still come through: those use error_log and
; catch_workers_output, not this.
access.log = /dev/null
