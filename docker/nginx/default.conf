server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Embedded Shopify apps render in an iframe.
    # Never send X-Frame-Options here — Shopify sets frame-ancestors itself.

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        # Room to sit on an Xdebug breakpoint. The default of 60s answers 504
        # while PHP is still paused. The tunnel's own ~100s limit still applies.
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
